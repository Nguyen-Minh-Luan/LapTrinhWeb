<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise4</title>
    <link rel="stylesheet" href="./fontawesome-free-6.6.0-web/css/all.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="form-login">
        <div class="container">
            <form action="index.html" method="get">
                <div class="account">
                    <label for="fullname" class="title">Account</label>
                    <div class="container-1">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="fullname" placeholder="Full Name">
                    </div>
                    <div class="container-2">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email-address" placeholder="Email Address">
                    </div>
                    <div class="container-3">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="password-acc" placeholder="Password">
                    </div>
                </div>
                <div class="container-3">
                    <label for="dob">Date of Birth</label>
                    <input type="text" id="day" placeholder="DD">
                    <input type="text" id="month" placeholder="MM">
                    <input type="text" id="year" placeholder="YYYY">
                </div>
                <div class="container-4">
                    <label for="gender">Gender</label>
                    <input type="button" id="male">
                    <input type="button" id="female">
                </div>
                <div class="container-5">
                    <label for="payment">Payment Details</label>
                    <i class="fa-brands fa-cc-visa"></i>
                    <input type="button" id="visa">
                    <i class="fa-brands fa-cc-paypal"></i>
                    <input type="button" id="paypal">
                    <input type="text" id="card-number" placeholder="Card Number">
                    <div class="container5-6">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="card-cvc" placeholder="Card CVC">
                        <select id="day-month">
                            <option value="day">01-Jan</option>
                        </select>
                        <select id="day-month">
                            <option value="year">2015</option>
                        </select>
                    </div>
                </div>
                <label for="terms-conditions">Terms and Conditions</label>
                <input type="checkbox" id="terms-conditions" placeholder="123">
                <label for="terms-conditions-content">I accept the terms and conditions for signing up to this service,
                    and hereby confirm i have read the privacy policy</label>
            </form>
        </div>
    </div>
</body>

</html>
